app_taxonomy:
  dsct:
    label: "Digital Self-Control Tools"
    description: "Apps or browser extensions that help users regulate digital device use, reduce distractions, and support focus. DSCT features follow Lyngs et al.'s four-cluster taxonomy."
    features:
      block_removal:
        label: "Block/Removal"
        source: "Lyngs et al."
        def: "Blocks, removes, hides, limits, delays, or restricts distracting apps, websites, content, feeds, notifications, or interface elements. This includes hard blocking, time limits before blocking, launch-count limits, time lags before distractions load, feature minimisation, hiding feeds, stripping distracting content, replacing new-tab content, and limiting device functionality."
        positive:
          - "app blocker"
          - "website blocker"
          - "block distracting apps"
          - "block distracting websites"
          - "hide news feed"
          - "remove recommendations"
          - "lock distracting apps"
          - "site blocker"
          - "distraction blocking"
          - "content blocker"
          - "hide YouTube recommendations"
          - "remove Facebook news feed"
          - "time limit before blocking"
          - "launch-count limit"
          - "time lag before distraction loads"
          - "minimal writing mode"
          - "replace new tab content"
          - "limit home screen functionality"
          - "strict blocking"
          - "block social media"
        negative:
          - "block of text"
          - "writer's block"
          - "building block"
          - "time blocking for planning"
          - "calendar block"
          - "project block"

      self_tracking:
        label: "Self-Tracking"
        source: "Lyngs et al."
        def: "Records, measures, visualises, or displays information about device use, app use, website use, screen time, focus sessions, countdown timers, productivity behaviour, or time spent not using the device."
        positive:
          - "screen time report"
          - "usage statistics"
          - "app usage tracking"
          - "time spent"
          - "focus timer"
          - "session tracking"
          - "productivity dashboard"
          - "usage history"
          - "activity tracking"
          - "time tracking"
          - "tracks phone usage"
          - "visualise usage data"
          - "timer"
          - "countdown"
          - "track time not using phone"
          - "daily usage report"
          - "focus session history"
          - "analytics dashboard"
        negative:
          - "delivery time"
          - "time zone"
          - "screen brightness"
          - "calendar time only"
          - "task deadline only"

      goal_advancement:
        label: "Goal-Advancement"
        source: "Lyngs et al."
        def: "Reminds, nudges, prompts, redirects, or supports users toward concrete time goals, task goals, general goals, values, intentions, or planned behaviour. This includes goal setting and comparing actual behaviour against goals."
        positive:
          - "goal reminder"
          - "task reminder"
          - "nudge"
          - "prompt"
          - "to-do list"
          - "new tab task list"
          - "usage goal"
          - "focus goal"
          - "redirect to productive site"
          - "reminds user of goal"
          - "goal prompt"
          - "motivational quote"
          - "set explicit goals"
          - "compare behaviour against goals"
          - "daily focus goal"
          - "planned behaviour reminder"
          - "intention reminder"
        negative:
          - "football goal"
          - "goal keeper"
          - "sports goal"
          - "soccer goal"
          - "goal score"
          - "scored a goal"
          - "goal post"
          - "goal net"

      reward_punishment:
        label: "Reward/Punishment"
        source: "Lyngs et al."
        def: "Uses rewards, punishments, incentives, points, streaks, leaderboards, achievements, gamification, virtual consequences, social sharing, or real-world rewards and penalties to encourage digital self-control."
        positive:
          - "points"
          - "reward"
          - "punishment"
          - "tree dies"
          - "plant grows"
          - "streak"
          - "badge"
          - "coin"
          - "challenge"
          - "penalty"
          - "virtual tree"
          - "gamified reward"
          - "leaderboard"
          - "achievement unlock"
          - "social sharing"
          - "lose money"
          - "earn discount"
          - "plant a tree"
          - "virtual pet"
          - "focus coins"
        negative:
          - "credit card rewards"
          - "shopping rewards"
          - "sports leaderboard"
          - "game unrelated to focus"

      custom_rules:
        label: "Custom Rules"
        source: "Project extension"
        def: "Allows users to customise what counts as a distraction or what is targeted by the tool, including blocked apps, websites, schedules, categories, allowed lists, block lists, or focus rules. This aligns with the cross-cutting customisation dimension in Lyngs et al., but is kept as a separate project feature for dashboard analysis."
        positive:
          - "custom block list"
          - "allow list"
          - "blacklist"
          - "whitelist"
          - "schedule blocking"
          - "custom rules"
          - "choose apps to block"
          - "choose websites to block"
          - "customise restrictions"
          - "custom categories"
          - "allowed apps"
          - "blocked websites"
          - "user-defined distraction list"
          - "select distracting apps"
          - "select allowed websites"
        negative:
          - "shopping list"
          - "playlist"
          - "wish list"
          - "task list only"

      override_friction:
        label: "Override Friction"
        source: "Project extension"
        def: "Adds effort, delay, restriction, or cost before users can bypass, disable, uninstall, or change an active block or restriction. This is related to Lyngs et al.'s override-friction sub-code under Block/Removal, but is kept separately for project-level analysis."
        positive:
          - "hard to disable"
          - "strict mode"
          - "password to unlock"
          - "type random letters"
          - "challenge to unlock"
          - "delay before unlock"
          - "cannot uninstall"
          - "difficult to bypass"
          - "lock mode"
          - "disallow stopping session"
          - "admin permission"
          - "payment to override"
          - "time lag before override"
          - "force mode"
          - "deep focus mode"
        negative:
          - "password manager"
          - "login password only"
          - "account password"
          - "forgot password"

      emergency_access:
        label: "Emergency Access"
        source: "Project extension"
        def: "Provides emergency bypass, pause, temporary unlock, break-glass access, or safe access when restrictions are active."
        positive:
          - "emergency access"
          - "temporary unlock"
          - "pause blocking"
          - "break glass"
          - "allow emergency use"
          - "unlock for emergency"
          - "emergency bypass"
          - "temporary pause"
          - "emergency override"
          - "quick unlock"
          - "temporary access"
        negative:
          - "emergency contact only"
          - "emergency notification only"
          - "medical emergency information"

      scheduling:
        label: "Scheduling"
        source: "Project extension"
        def: "Allows users to schedule blocking, focus sessions, restrictions, routines, recurring self-control periods, work-hour limits, or automatic focus periods."
        positive:
          - "schedule blocking"
          - "automatic schedule"
          - "recurring focus session"
          - "daily blocking schedule"
          - "work hours"
          - "sleep schedule"
          - "scheduled restrictions"
          - "automatic focus schedule"
          - "repeat focus session"
          - "weekday schedule"
          - "focus timetable"
          - "scheduled focus mode"
        negative:
          - "calendar event only"
          - "meeting schedule only"
          - "task schedule only"

  habit_apps:
    label: "Habit Apps"
    description: "Apps that help users build, monitor, maintain, or improve habits and routines. These apps may support productivity and focus, but they are classified separately from DSCTs unless explicit digital self-control features are present."
    features:
      habit_tracking:
        label: "Habit Tracking"
        source: "Project extension"
        def: "Tracks repeated habits, daily behaviours, routines, completion status, or consistency over time."
