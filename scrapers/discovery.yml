# scrapers/discovery.yml
# Purpose:
# Discover apps that are genuinely related to focus, ADHD support,
# productivity, habit-building, distraction blocking, routine planning,
# Pomodoro/time management, and executive-function support.
#
# This file is designed to improve competitor coverage while reducing
# irrelevant apps such as AI chatbots, office suites, workout timers,
# finance planners, games, wallpapers, VPN tools, browsers, and general utilities.

