limits:
  # Increased carefully to capture more relevant apps.
  # If too many irrelevant apps return, reduce max_total_candidates back to 500.
  per_keyword_per_store: 75
  similar_per_app: 25
  max_total_candidates: 1500

filters:
  min_rating_count: 5
  min_play_installs: 1000
  min_cws_users: 500
  min_relevance: 0.15

  # ------------------------------------------------------------
  # Strong include terms
  # These are allowed to indicate real focus/productivity/ADHD relevance.
  # Generic words like "timer", "planner", and "habit" are intentionally
  # removed from this list unless they appear as stronger phrases.
  # ------------------------------------------------------------
  include_terms:
    # Core focus/productivity signals
    - focus
    - focused
    - focus mode
    - focus session
    - productivity
    - productive
    - concentration
    - deep work
    - study focus
    - distraction free
    - anti distraction
    - procrastination

    # Pomodoro/time-management signals
    - pomodoro
    - focus timer
    - study timer
    - work timer
    - deep work timer
    - time blocking
    - timeboxing
    - time management
    - visual timer
    - time timer

    # Distraction blocking/screen-time signals
    - distraction
    - distraction blocker
    - block distractions
    - block distracting apps
    - block distracting websites
    - blocker
    - website blocker
    - site blocker
    - app blocker
    - block apps
    - screen time
    - screen time control
    - screen time limit
    - digital wellbeing
    - digital wellness
    - digital detox
    - phone addiction
    - phone usage limit
    - social media blocker
    - internet blocker

    # ADHD/executive-function signals
    - adhd
    - adhd planner
    - adhd focus
    - adhd productivity
    - adhd routine
    - adhd task manager
    - adhd habit tracker
    - adhd time management
    - executive function
