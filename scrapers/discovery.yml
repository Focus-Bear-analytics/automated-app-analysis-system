    - task manager focus
    - daily planner productivity
    - reminders app productivity
    - todo focus

    # Supportive focus environment
    - focus sounds
    - focus music
    - study with me

  force_include_titles:
  - todo list - focus tasks
  - mindshield - digital wellbeing tool
  - "circle: stay focused"
  - dwt - procrastination tracker
  - blockit | stop phone addiction
  - bosla - time boxing, 2nd brain
  - "study planner: task splitter"
  - timebox planner
  - "visual schedule: daily planner"
  - adhd-friendly todo list
  - byebyedistraction
  - addiction blocker
  - beyond - digital wellbeing
  - focused todo
  - productivitypro - smart time tracker     

  # ------------------------------------------------------------
  # Weak/generic terms
  # These words are NOT enough by themselves.
  # They should only be accepted when combined with a strong signal above.
  # Current Python code may not use this block automatically unless we update it,
  # but it documents the intended rule clearly.
  # ------------------------------------------------------------
  weak_scope_terms:
    - timer
    - planner
    - habit
    - task
    - todo
    - reminder
    - goal
    - schedule
    - calendar
    - journal
    - tracker
    - wellness
    - mind
    - motivation

  # ------------------------------------------------------------
  # Required strong scope terms
  # If an app only has weak terms like "timer", "planner", or "habit",
