  # scrapers/seeds.yml
# Expanded seed list for focus/productivity/ADHD-related competitor discovery.
#
# Purpose:
# Use verified app IDs as starting points for discovering more real competitors.
# These seeds cover different subgroups:
# - focus timers
# - Pomodoro apps
# - app / website blockers
# - screen-time control
# - ADHD planners
# - habit trackers
# - routine planners
# - study planners
# - task planners
#
# Do NOT add broad AI chatbots, office suites, document editors, browsers,
# games, VPN apps, wallpapers, finance apps, workout timers, or general utilities.

