# scrapers/seeds.yml
# Expanded seed list for focus/productivity/ADHD-related competitor discovery.
#
# Purpose:
# Use known relevant apps as starting points for discovering more competitors.
# Seeds should stay within focus, ADHD support, productivity, Pomodoro,
# habit-building, routine planning, task management, and distraction-blocking.
#
# Do NOT add broad AI chatbots, office suites, document editors, browsers,
# games, VPN apps, wallpapers, or general utilities here.

play_ids:
  # Focus / forest-style productivity
  - cc.forestapp          # Forest: focus and productivity

  # Distraction blocking / app blocking
  - com.stayfocused      # Stay Focused: app and website blocker
  - com.blocksite        # BlockSite: distraction blocking

  # Pomodoro / focus timer
  - com.superelement.pomodoro   # Focus To-Do / Pomodoro-style app
  - com.pomodrone.app           # Pomodoro-style focus timer

  # Habit and routine support
